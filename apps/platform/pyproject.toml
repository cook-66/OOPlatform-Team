# apps/platform/pyproject.toml
# =============================================================================
# ODPlatform - platform 端配置 (hatchling backend)
# =============================================================================

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"


[project]
name = "od-platform"
dynamic = ["version"]                              # 版本号从 _version.py 动态读
description = "ODPlatform - 目标检测开发平台核心引擎"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ODPlatform Team" },
]
keywords = ["object-detection", "yolo", "deep-learning", "ml-platform"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "colorlog>=6.7.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "ultralytics>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic>=2.5,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]


# =============================================================================
# Entry-point Scripts (PEP 621 标准字段, 与 backend 无关)
# =============================================================================
[project.scripts]
odp-init = "od_platform.cli.init_project:initialize_project"
odp-reset = "od_platform.cli.reset_project:main"
odp-transform = "od_platform.cli.transform_data:main"
odp-validate = "od_platform.cli.validate_data:main"
odp-gen-config = "od_platform.runtime_config.generator:main"
odp-train       = "od_platform.cli.train_model:main"                  # D6
odp-infer       = "od_platform.cli.infer:main"                        # D7



# =============================================================================
# Hatchling 配置 (告诉它两件事: 包源码在哪、版本号从哪读)
# =============================================================================

# 告诉 hatchling 包源码在 src/od_platform/
[tool.hatch.build.targets.wheel]
packages = ["src/od_platform"]

# 动态版本号: 从 src/od_platform/_version.py 的 __version__ 读
[tool.hatch.version]
path = "src/od_platform/_version.py"

[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",      # 拼错的 mark 立刻报错,不再静默不跑
    "--tb=short",
]
filterwarnings = [
    # 业务代码用 warnings.warn 发的提示,测试里要能捕获
    "default::UserWarning",
]